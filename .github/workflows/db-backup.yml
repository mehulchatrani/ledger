name: Daily Turso DB Backup

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Turso CLI
        run: |
          curl -sL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: Validate Turso secrets
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_DB_NAME: ${{ secrets.TURSO_DB_NAME }}
        run: |
          if [ -z "$TURSO_API_TOKEN" ] || [ -z "$TURSO_DB_NAME" ]; then
            echo "Missing TURSO_API_TOKEN or TURSO_DB_NAME secret"
            exit 1
          fi

      - name: Check Turso access
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_DB_NAME: ${{ secrets.TURSO_DB_NAME }}
        run: |
          echo "TURSO_DB_NAME=${TURSO_DB_NAME}"
          echo "TURSO_API_TOKEN present: ${TURSO_API_TOKEN:+yes}"
          turso db list

      - name: Dump Database to SQL
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_DB_NAME: ${{ secrets.TURSO_DB_NAME }}
        run: |
          backup_file="backup-$(date +%Y-%m-%d).sql"
          turso db shell "$TURSO_DB_NAME" ".dump" > "$backup_file"
          ls -l "$backup_file"

      - name: Save Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: turso-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 30
