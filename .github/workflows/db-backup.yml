name: Daily Turso DB Backup

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Turso CLI
        run: |
          curl -sL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> $GITHUB_PATH

      - name: Dump Database
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          turso db dump ${{ secrets.TURSO_DB_NAME }} > backup-$(date +%Y-%m-%d).sql

      - name: Save Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: turso-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 30
